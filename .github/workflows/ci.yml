name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # release.yml calls this via `uses: ./.github/workflows/ci.yml` so tag
  # releases run the exact same test matrix as per-PR CI.
  workflow_call: {}

# Pushing three times to a branch used to queue three full matrices and run all of them. A newer
# pull-request run supersedes the older one; a push to main is not cancelled, because main wants a
# recorded result for every commit rather than only for the newest.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                          # version.pl needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      # The headless Avalonia tests render real frames through Skia, which needs
      # fontconfig on the Linux runner.
      - name: Install rendering dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1 fonts-dejavu-core

      - name: Restore
        run: dotnet restore ShiftDiff.slnx

      - name: Build
        run: dotnet build ShiftDiff.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test ShiftDiff.slnx
          --configuration Release --no-build
          --logger "trx;LogFileName=tests.trx"

      # Failures surface as check-run annotations so they are diagnosable
      # from the run summary without downloading artifacts.
      - name: Annotate failing tests
        if: failure()
        shell: python
        run: |
          import glob
          import xml.etree.ElementTree as ET
          ns = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          for f in glob.glob('**/*.trx', recursive=True):
              try:
                  tree = ET.parse(f)
              except Exception:
                  continue
              for r in tree.getroot().iter(ns + 'UnitTestResult'):
                  if r.get('outcome') != 'Failed':
                      continue
                  message = ''
                  m = r.find('.//' + ns + 'Message')
                  if m is not None and m.text:
                      message = ' '.join(m.text.split())[:600]
                  print(f"::error::FAILED {r.get('testName')}: {message}")

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
