name: UI Showcase

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main, master]
    paths:
      - 'src/ShiftDiff.App/**'
      - 'docs/showcase/**'
      - 'scripts/capture-showcase.sh'
      - '.github/workflows/showcase.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  capture:
    name: Capture Avalonia UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Install virtual display tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xdotool imagemagick

      - name: Publish app
        run: dotnet publish src/ShiftDiff.App --configuration Release --output artifacts/app

      - name: Capture dark workspace
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          bash scripts/capture-showcase.sh Dark artifacts/screenshots/workspace-dark.png

      - name: Capture light workspace
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          bash scripts/capture-showcase.sh Light artifacts/screenshots/workspace-light.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: shiftdiff-ui-showcase
          path: artifacts/screenshots/*.png
          if-no-files-found: error
